[package]
name = "dotz"
version = "0.1.0"
edition = "2024"
publish = false
license = "Unlicense"
description = "A colorscript that gradually fills your screen with (a) character."
readme = "README.md"
homepage = "https://github.com/KP64/dotz"
repository = "https://github.com/KP64/dotz"
keywords = ["cli, terminal, ricing, color, script"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "=4.6.1", features = ["derive"] }
crossterm = { version = "=0.29.0", default-features = false, features = [
  "events",
  "windows",
] }
rand = "=0.10.1"

[profile.release]
lto = true
codegen-units = 1

[lints.clippy.cargo]
level = "warn"
priority = -1

[lints.clippy.nursery]
level = "warn"
priority = -1

[lints.clippy.pedantic]
level = "warn"
priority = -1

[lints.clippy.restriction]
level = "warn"
priority = -1

[lints.clippy]
blanket_clippy_restriction_lints = "allow"
single_call_fn = "allow"
question_mark_used = "allow"
implicit_return = "allow"
missing_inline_in_public_items = "allow"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
separated_literal_suffix = "allow"
float_arithmetic = "allow"
multiple_crate_versions = "allow"

[lints.rust]
absolute_paths_not_starting_with_crate = "warn"
ambiguous_negative_literals = "warn"
closure_returning_async_block = "warn"
deref_into_dyn_supertrait = "warn"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
ffi_unwind_calls = "warn"
if_let_rescope = "warn"
impl_trait_redundant_captures = "warn"
macro_use_extern_crate = "deny"
meta_variable_misuse = "warn"
missing_docs = "warn"
non_ascii_idents = "forbid"
redundant_imports = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_crate_dependencies = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
unused_results = "warn"
variant_size_differences = "warn"

[lints.rust.let_underscore]
level = "warn"
priority = -1
